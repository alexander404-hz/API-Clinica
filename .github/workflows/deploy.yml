name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Evita que dos despliegues migren la base de datos al mismo tiempo
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Los secretos viven en Settings > Environments > production
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall ejecuta `prisma generate`
      - name: Install dependencies
        run: npm ci

      # Solo aplica las migraciones que falten; si no hay nuevas, no hace nada
      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Solo se llega aquí si la migración funcionó
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
